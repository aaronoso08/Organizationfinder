<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Home Repair Partners Directory 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6B2D0F;--brand-mid:#8B3A12;--brand-light:#A0522D;
  --accent:#E87A2A;--accent-light:#F59E0B;
  --bg:#F7F3EF;--surface:#FFF;--surface2:#FDF8F4;
  --border:#E8DDD4;--border-dark:#D4C4B0;
  --text:#1C1209;--text2:#5C4033;--text3:#9C7B6B;
  --green:#16A34A;--green-bg:#DCFCE7;--green-dark:#166534;
  --red:#DC2626;--red-bg:#FEE2E2;--red-dark:#991B1B;
  --yellow:#D97706;--yellow-bg:#FEF3C7;--yellow-dark:#92400E;
  --blue:#1D4ED8;--blue-bg:#DBEAFE;
  --gray:#6B7280;--gray-bg:#F3F4F6;
  --sh-sm:0 1px 3px rgba(107,45,15,.08);
  --sh:0 4px 12px rgba(107,45,15,.12);
  --sh-lg:0 12px 32px rgba(107,45,15,.18);
  --r:10px;--rl:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* TOPBAR */
.topbar{
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-mid) 60%,var(--brand-light) 100%);
  color:#fff;padding:env(safe-area-inset-top,0px) 16px 14px;
  display:flex;flex-direction:column;gap:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.25);position:sticky;top:0;z-index:50
}
.topbar-brand{display:flex;align-items:center;gap:10px;padding-top:12px}
.topbar-icon{width:34px;height:34px;background:rgba(255,255,255,.15);border-radius:10px;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.2);
  flex-shrink:0;font-size:1.1rem}
.topbar-title{font-size:.95rem;font-weight:800;letter-spacing:-.02em}
.topbar-sub{font-size:.62rem;opacity:.65;margin-top:1px}

/* SEARCH */
.search-wrap{position:relative}
.search-wrap input{
  width:100%;padding:10px 12px 10px 36px;
  border:1.5px solid rgba(255,255,255,.25);border-radius:var(--r);
  font-size:.83rem;outline:none;background:rgba(255,255,255,.13);
  font-family:inherit;color:#fff;transition:all .15s
}
.search-wrap input::placeholder{color:rgba(255,255,255,.5)}
.search-wrap input:focus{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.2);box-shadow:0 0 0 3px rgba(255,255,255,.1)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.6);font-size:.9rem}

/* FILTER PILLS */
.pills-bar{padding:12px 16px 8px;display:flex;gap:6px;flex-wrap:wrap;
  background:var(--surface);border-bottom:1.5px solid var(--border)}
.pill{padding:7px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);
  font-size:.72rem;cursor:pointer;font-weight:600;color:var(--text2);
  transition:all .15s;font-family:inherit;white-space:nowrap}
.pill:hover{border-color:var(--accent);color:var(--brand)}
.pill.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* RESULTS BAR */
.results-bar{padding:8px 16px;font-size:.75rem;color:var(--text3);
  background:var(--surface);border-bottom:1.5px solid var(--border);font-weight:500}
.results-bar strong{color:var(--brand)}

/* CARDS */
.cards{padding:14px 16px 60px;display:flex;flex-direction:column;gap:10px;max-width:960px;margin:0 auto}

/* CARD */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rl);
  overflow:hidden;box-shadow:var(--sh-sm);transition:all .18s}
.card:hover{border-color:var(--border-dark);box-shadow:var(--sh)}
.card.open{border-color:var(--accent);box-shadow:var(--sh)}

.card-header{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 12px;
  cursor:pointer;position:relative;overflow:hidden}
.card-header::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  border-radius:4px 0 0 4px;background:var(--border-dark);transition:background .18s}
.card.open .card-header::before{background:var(--accent)}

.card-icon{width:40px;height:40px;border-radius:10px;background:var(--surface2);
  border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;flex-shrink:0}
.card-title-block{flex:1;min-width:0}
.card-name{font-size:.92rem;font-weight:800;color:var(--text);line-height:1.25;
  margin-bottom:5px;letter-spacing:-.01em}
.card-tags{display:flex;flex-wrap:wrap;gap:4px}

/* TAG BADGES */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;
  font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tag-default{background:var(--yellow-bg);color:var(--yellow-dark)}
.tag-pcef{background:var(--green-bg);color:var(--green-dark)}
.tag-gov{background:var(--blue-bg);color:var(--blue)}
.tag-free{background:#F3E8FF;color:#6B21A8}
.tag-bipoc{background:var(--red-bg);color:var(--red-dark)}

.chevron{color:var(--text3);font-size:.85rem;transition:transform .22s;margin-top:3px;flex-shrink:0}
.card.open .chevron{transform:rotate(180deg)}

/* CARD BODY */
.card-body{display:none;padding:0 14px 16px;border-top:1.5px solid var(--border);
  animation:slideDown .2s ease}
.card.open .card-body{display:block}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}

.section-label{font-size:.67rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  color:var(--brand);margin:14px 0 6px}
.card-desc{font-size:.84rem;color:var(--text2);line-height:1.55;margin-top:12px}
.card-body ul{padding-left:16px}
.card-body li{font-size:.83rem;color:var(--text2);line-height:1.5;margin-bottom:3px}

.req-box{background:var(--surface2);border:1.5px solid var(--border);
  border-radius:var(--r);padding:10px 12px;margin-top:4px}

.note-box{background:var(--yellow-bg);border-left:3px solid var(--accent);
  border-radius:0 var(--r) var(--r) 0;padding:9px 12px;margin-top:10px;
  font-size:.8rem;color:var(--yellow-dark);line-height:1.5}

.contact-grid{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.contact-item{display:flex;align-items:flex-start;gap:8px;font-size:.82rem;color:var(--text2);line-height:1.4}
.contact-icon{color:var(--accent);flex-shrink:0;margin-top:1px;font-size:.85rem}
.contact-item a{color:var(--brand-light);text-decoration:none;word-break:break-all}
.contact-item a:hover{text-decoration:underline;color:var(--accent)}
</style>
</head>

function tagHTML(tags){return tags.map(t=>{const cls={default:'tag-default',pcef:'tag-pcef',gov:'tag-gov',free:'tag-free',bipoc:'tag-bipoc'}[t.c]||'tag-default';return`<span class="tag ${cls}">${t.t}</span>`;}).join('');}

function buildCard(org,idx){
  const ctc=org.contacts.map(c=>{let l=`<span class="contact-icon">👤</span><span>${c.label}`;if(c.phone)l+=` &bull; <a href="tel:${c.phone}">${c.phone}</a>`;if(c.email)l+=` &bull; <a href="mailto:${c.email}">${c.email}</a>`;l+='</span>';return`<div class="contact-item">${l}</div>`;}).join('');
  const ph=org.phone?`<div class="contact-item"><span class="contact-icon">📞</span><span><a href="tel:${org.phone}">${org.phone}</a></span></div>`:'';
  const wb=org.website?`<div class="contact-item"><span class="contact-icon">🌐</span><span><a href="${org.website.startsWith('http')?org.website:'https://'+org.website}" target="_blank">${org.website}</a></span></div>`:'';
  const svc=org.services.length?`<div class="section-label">Services Offered</div><ul>${org.services.map(s=>`<li>${s}</li>`).join('')}</ul>`:'';
  const req=org.requirements.length?`<div class="section-label">Requirements & Eligibility</div><div class="req-box"><ul>${org.requirements.map(r=>`<li>${r}</li>`).join('')}</ul></div>`:'';
  const cc=(ctc||ph||wb)?`<div class="section-label">Contact</div><div class="contact-grid">${ctc}${ph}${wb}</div>`:'';
  const nt=org.notes?`<div class="note-box">💡 ${org.notes}</div>`:'';
  const srch=(org.name+' '+org.tags.map(t=>t.t).join(' ')+' '+org.services.join(' ')+' '+org.description).toLowerCase();
  return`<div class="card" data-idx="${idx}" data-filters="${org.filters.join(' ')}" data-search="${srch}"><div class="card-header" onclick="this.closest('.card').classList.toggle('open')"><div class="card-icon">${org.icon}</div><div class="card-title-block"><div class="card-name">${org.name}</div><div class="card-tags">${tagHTML(org.tags)}</div></div><div class="chevron">▼</div></div><div class="card-body"><div class="card-desc">${org.description}</div>${svc}${req}${cc}${nt}</div></div>`;
}

document.getElementById('cardsContainer').innerHTML=orgs.map((o,i)=>buildCard(o,i)).join('');

let activeFilter='all';
function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  let n=0;
  document.querySelectorAll('.card').forEach(c=>{
    const show=(activeFilter==='all'||c.dataset.filters.includes(activeFilter))&&(!q||c.dataset.search.includes(q));
    c.style.display=show?'':'none';
    if(show)n++;
  });
  document.getElementById('resultsBar').innerHTML=`Showing <strong>${n}</strong> organization${n!==1?'s':''}`;
}

document.querySelectorAll('.pill').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeFilter=b.dataset.filter;applyFilters();});});
document.getElementById('search').addEventListener('input',applyFilters);
</script>
